# Intake for the cloud backlog run (docs/backlog/README.md): code — not an agent — moves small, checkable items into
# docs/backlog/QUEUE.md: the day's proposals (docs/backlog/proposals/), tech-debt notes (docs/backlog/tech-debt/) and
# open `tech-debt` issues, all in the proposal format; `kind: bug` is picked first. No daily cap (signal-bot). What is not a small
# checkable task is logged in docs/backlog/intake-log.md. Started after every automerge sweep that merged something,
# when a tech-debt issue is opened or edited, and by cron as a fallback. Rules: scripts/backlog/backlog.py, `intake`.
name: intake

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '50 */3 * * *'  # every 3 hours at :50 UTC; a run with nothing new commits nothing
  workflow_dispatch:
    inputs:
      date:
        description: 'Day of the proposals (YYYY-MM-DD, UTC); empty = today'
        required: false

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'tech-debt')
    runs-on: ubuntu-latest
    # Job-level, so an unrelated issue event (skipped by the `if`) never replaces a pending run that matters.
    concurrency:
      group: intake
      cancel-in-progress: false
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stop when paused
        id: pause
        run: |
          if python3 scripts/backlog/backlog.py paused; then echo "paused=true" >> "$GITHUB_OUTPUT"; fi
      - name: Move proposals into the queue
        if: steps.pause.outputs.paused != 'true'
        env:
          DAY: ${{ inputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Yesterday too: a proposals PR merged after this time yesterday is not lost.
          : > /tmp/accepted.txt
          if [ -n "$DAY" ]; then
            python3 scripts/backlog/backlog.py intake --date "$DAY" --issues --accepted-out /tmp/accepted.txt
          else  # tech debt (files, issues) is read once, on today's pass, so its tasks carry today's date
            python3 scripts/backlog/backlog.py intake --date "$(date -u -d yesterday +%F)" --proposals-only --accepted-out /tmp/accepted.txt
            python3 scripts/backlog/backlog.py intake --date "$(date -u +%F)" --issues --accepted-out /tmp/accepted.txt
          fi
          python3 scripts/backlog/backlog.py lint
      - name: Commit to main
        if: steps.pause.outputs.paused != 'true'
        run: |
          git config user.name "backlog-intake"
          git config user.email "backlog-intake@users.noreply.github.com"
          git add docs/backlog/QUEUE.md docs/backlog/intake-log.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "backlog: intake of proposals ($(date -u +%F))"
          for i in 1 2 3; do   # automerge may have moved main since the checkout
            if git push origin HEAD:main; then pushed=1; break; fi
            git pull --rebase origin main || exit 1
          done
          [ "${pushed:-}" = 1 ] || exit 1
      - name: Close the tech-debt issues that became tasks
        if: steps.pause.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/backlog/backlog.py close-issues
