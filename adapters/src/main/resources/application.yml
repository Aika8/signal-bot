spring:
  application:
    name: signal-bot
  main:
    web-application-type: none    # worker app; RestClient is used, no web server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:signalbot}
    username: ${POSTGRES_USER:signalbot}
    password: ${POSTGRES_PASSWORD:signalbot}
  flyway:
    enabled: true
    locations: classpath:db/migration

signalbot:
  fx:
    usd-kzt: ${FX_USD_KZT:525.0}
    eur-kzt: ${FX_EUR_KZT:565.0}
  paper:
    seed-kzt: ${PAPER_SEED_KZT:1000000}
    fee-rate: 0.001                      # non-US fallback: 0.1% of notional
    fee-per-share-usd: ${FEE_PER_SHARE_USD:0.005}
    fee-per-order-usd: ${FEE_PER_ORDER_USD:1.00}
    tax-rate: 0.10
    fill-delay-seconds: 60
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:signal_bot}
    chat-id: ${TELEGRAM_CHAT_ID:}
  claude:
    enabled: ${CLAUDE_ENABLED:false}       # increment 4: off = stay in dry-run
    model: claude-opus-5-5
    max-tokens: 2000
  watchlist:
    # Config-only, max 10 US symbols.
    symbols: ${WATCHLIST:AAPL,MSFT,NVDA,AMZN,GOOGL}
  portfolio:
    source: ${PORTFOLIO_SOURCE:paper}    # paper | file | private
    file: ${PORTFOLIO_FILE:portfolio.yml}
  alpaca:
    enabled: ${ALPACA_ENABLED:false}
    key-id: ${ALPACA_API_KEY:}
    api-secret: ${ALPACA_API_SECRET:}
    data-url: https://data.alpaca.markets
    stream-url: wss://stream.data.alpaca.markets/v2/iex
    trading-url: https://paper-api.alpaca.markets
  finnhub:
    enabled: ${FINNHUB_ENABLED:false}
    token: ${FINNHUB_TOKEN:}
    base-url: https://finnhub.io/api/v1
  trigger:
    dry-run: ${DRY_RUN:true}            # increment 3: log triggers, do not call Claude
    price-move-pct: 0.03                 # T1: >= 3% move
    price-window-minutes: 15             # T1: within 15 minutes
    debounce-minutes: 10                 # at most one dispatch per symbol per 10 min
    earnings-within-trading-days: 2      # T3: earnings within next 2 trading days
    news-poll-cron: "0 */5 * * * *"      # every 5 minutes
    earnings-poll-cron: "0 0 6 * * *"    # daily at 06:00
    guard-snapshot-ms: 30000             # REST exit-guard safety net (ms)
  execution:
    mode: ${EXECUTION_MODE:MANUAL}       # MANUAL (confirm each) or AUTO (auto-fill, unattended testing)
    timeout: ${EXECUTION_TIMEOUT:PT30M}  # PENDING older than this becomes EXPIRED
    auto-fill-delay: PT60S               # AUTO: delay before auto-fill at last price
    sweep-ms: 15000                      # how often the execution sweeper runs

resilience4j:
  retry:
    instances:
      telegram: { max-attempts: 3, wait-duration: 500ms, enable-exponential-backoff: true, exponential-backoff-multiplier: 2 }
      alpaca:   { max-attempts: 3, wait-duration: 500ms, enable-exponential-backoff: true, exponential-backoff-multiplier: 2 }
      finnhub:  { max-attempts: 3, wait-duration: 1s,    enable-exponential-backoff: true, exponential-backoff-multiplier: 2 }
      claude:   { max-attempts: 2, wait-duration: 2s,    enable-exponential-backoff: true, exponential-backoff-multiplier: 2 }
  circuitbreaker:
    instances:
      telegram: { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      alpaca:   { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      finnhub:  { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      claude:   { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 60s }
  ratelimiter:
    instances:
      finnhub:  { limit-for-period: 60, limit-refresh-period: 60s, timeout-duration: 5s }

# One-off screener (./gradlew screen). Not used by the worker runtime.
screen:
  max-price: ${SCREEN_MAX_PRICE:250}
  candidates:
    - AMD
    - INTC
    - MU
    - QCOM
    - CSCO
    - PLTR
    - UBER
    - ABNB
    - PYPL
    - SOFI
    - BAC
    - WFC
    - C
    - SCHW
    - PFE
    - MRK
    - CVS
    - BMY
    - XOM
    - OXY
    - DVN
    - F
    - GM
    - DAL
    - UAL
    - NKE
    - SBUX
    - TGT
    - DIS
    - KSPI

