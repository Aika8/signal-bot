services:
  postgres:
    image: postgres:16-alpine
    container_name: signalbot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalbot}
      POSTGRES_USER: ${POSTGRES_USER:-signalbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signalbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - signalbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signalbot} -d ${POSTGRES_DB:-signalbot}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signalbot-pgdata:
